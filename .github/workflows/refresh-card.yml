# Daily refresh of the gh-ascii card (adapted from crafter-station/gh-ascii's example).
# Uses the committed contrast-boosted portrait.jpg instead of the raw avatar, so the face stays sharp.
# Heads-up: GitHub disables scheduled workflows after 60 days of repo inactivity; re-enable from the Actions tab.
name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download both themes
        env:
          HANDLE: shivkumr-ai
          GH_ASCII_URL: https://gh.crafter.run
          COLS: "160"
        run: |
          for t in dark light; do
            curl -fsSL --retry 3 --retry-delay 5 -X POST \
              -F image=@portrait.jpg -F theme=$t -F cols=$COLS \
              "$GH_ASCII_URL/$HANDLE" -o ${t}_mode.svg
          done

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged — nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi
